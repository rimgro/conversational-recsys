# Запуск из папки candgen/:  docker compose up --build
# Сначала индексы:           docker compose run --rm build-indexes
services:
  candgen:
    build:
      context: ..
      dockerfile: candgen/Dockerfile
    ports:
      - "8000:8000"
    environment:
      BM25_INDEXES_DIR: /indexes/bm25
      HNSW_INDEXES_DIR: /indexes/hnsw
      # Пусто = без авторизации (локально). Задайте значение, чтобы требовать заголовок X-API-Key.
      BM25_API_KEY: ${CANDGEN_API_KEY:-}
    volumes:
      - ../indexes:/indexes:ro
    restart: unless-stopped

  # Разовая задача: индексы из ../data/tracks_meta.parquet в ../indexes.
  # После пересборки: docker compose restart candgen (индексы читаются один раз при старте).
  build-indexes:
    build:
      context: ..
      dockerfile: candgen/Dockerfile
    profiles: ["tools"]
    user: root
    volumes:
      - ../indexes:/indexes
      - ../data:/data:ro
    entrypoint: ["sh", "/app/build_indexes.sh", "/data/tracks_meta.parquet", "/indexes"]
