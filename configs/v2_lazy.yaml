# Прогон без башни Павла (его готовые списки для similar_to чистились по qrels): bm25, history и наши башни v2 и
# lazy — все голосуют с силой 1, ранги башен в признаках CatBoost. test nDCG@20 0.4834 (14.10.2026).
#   python -m recsys run --run v2_lazy --sources bm25,history,twotower,twotower_lazy --config configs/v2_lazy.yaml --parts test
#   python -m recsys.inference chat --config runs/v2_lazy/config.yaml --history britpop \
#     --set candgen.sources.twotower.online=true --set candgen.sources.twotower_lazy.online=true
# Нужны artifacts/twotower/v2 и lazy_e0 (векторы запросов частей; для онлайна — model.pt) и artifacts/item_text.

candgen:
  sources:
    twotower:      {enabled: true, features: true}
    twotower_lazy: {enabled: true, features: true}

selection:
  weights: {bm25: 1, history: 1, twotower: 1, twotower_lazy: 1}
  filters: [banned]

ranker:
  catboost:
    iterations: 1000           # early stopping по valid: 801 дерево
