# Ранкер LightGBM (ranker_assets/v3) поверх того же пула, на котором он обучен:
#   cfg = load_config(["configs/default.yaml", "configs/candgen.yaml", "configs/ranker_lgbm.yaml"])
# bm25_cards + hnsw по 100 -> RRF k = 60 без весов -> top-200. Другой пул меняет rrf_score / n_sources,
# и качество ранкера падает, пока его не переобучат на новом пуле (ranker/README.md: make_candidates -> pit -> fit).
retrieval:
  bm25:     {enabled: false}
  relisten: {enabled: false}
  title:    {enabled: false}
  lyrics:   {enabled: false}
  history:  {enabled: false}
  audio:    {enabled: false}
  popular:  {enabled: false}
  bm25_cards: {enabled: true, top_k: 100}
  hnsw:       {enabled: true, top_k: 100}

fusion:
  rrf_k: 60
  top_n: 200
  weights: {bm25_cards: 1.0, hnsw: 1.0}

ranker:
  type: lgbm
  top_k: 20
  model_dir: ranker_assets/v3
