# Пути относительные: ноутбук запускается из корня репозитория.

data:
  source: synthetic            # synthetic (работает сразу) | crs (Music4All-CRS, docs/dataset.md)
  eval_split: test_public      # на каких запросах считать метрики
  max_positives_per_user: 5    # сколько позитивов (= запросов) брать на пользователя; null = все
  max_tags: 20                 # теги Last.fm с наибольшим весом
  seed: 42
  cache_dir: data/cache        # кэш каталога crs (parquet + эмбеддинги .npy)
  use_cache: true

  synthetic:
    n_tracks: 5000
    n_users: 300
    seed: 42

  crs:
    dir: data                  # tracks_meta.parquet, train.parquet, test_public.parquet
    splits: [train, test_public]
    n_users: 300               # сэмпл пользователей на сплит (полный train ~12.9k); null = все
    seed: 42
    with_lyrics: false         # тексты песен в каталог (нужно для поиска по строчке текста)

llm:
  type: stub                   # stub | local
  model_name: Qwen/Qwen2.5-1.5B-Instruct   # для качества: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 512
  temperature: 0.0
  device_map: auto
  torch_dtype: auto
  load_in_4bit: false
  stub_response: ""           # что отвечает StubLLM (пусто -> правила/шаблон)

summarizer:
  type: rule                   # rule (заглушка) | llm (фолбэк на rule)
  min_tag_count: 2

candgen:                       # сервисы-кандгены по HTTP (API: docs/candgen_api.md); включается configs/candgen.yaml
  timeout: 5.0                 # секунды на запрос; при ошибке источник пропускается
  retries: 1                   # повтор при обрыве соединения (таймаут не повторяется)
  headers: {}                  # доп. заголовки ко всем запросам; ${VAR} берётся из окружения
  bm25:
    url: ${BM25_URL}           # адрес сервера BM25 (.env или секрет DataSphere)
    api_key: ${BM25_API_KEY}   # заголовок X-API-Key; пусто = без ключа

retrieval:                     # enabled: false выключает источник; type по умолчанию = имя (recsys/retrieval/sources.py)
  bm25:     {enabled: true, top_k: 200, k1: 1.2, b: 0.75}
  relisten: {enabled: true, top_k: 100, history_weight: 0.3}   # свои треки: 93% целей отсюда
  title:    {enabled: true, top_k: 50, min_coverage: 0.4}      # артист + название, транслит
  lyrics:   {enabled: false, top_k: 50}                        # нужен data.crs.with_lyrics: true
  history:  {enabled: true, top_k: 200, n_tags: 15, n_artists: 5}
  audio:    {enabled: true, top_k: 200}                        # эмбеддинги MuQ
  popular:  {enabled: true, top_k: 100}
  # BM25 с сервера (recsys/retrieval/remote.py), адрес в candgen.bm25
  bm25_genres: {enabled: false, type: bm25_api, index: genres, query: tags, top_k: 200}
  bm25_tags:   {enabled: false, type: bm25_api, index: tags, query: tags, top_k: 200}
  bm25_title:  {enabled: false, type: bm25_api, index: title, query: title, top_k: 50}

fusion:
  rrf_k: 60
  top_n: 500                   # сколько отдаём в ранкер
  exclude_listened: false      # 93% целей в датасете — повторные прослушивания, их нельзя выкидывать
  weights: {bm25: 1.0, relisten: 1.0, title: 1.5, lyrics: 1.5, history: 0.5, audio: 0.5, popular: 0.2,
            bm25_genres: 0.7, bm25_tags: 0.7, bm25_title: 1.0}
  no_query_boost: {relisten: 1.5, history: 2.0, audio: 1.5, popular: 1.5}   # запрос пустой («ещё»)
  cold_start_boost: {popular: 2.0}                                         # истории нет

ranker:
  type: stub                   # stub (порядок RRF) | heuristic | api
  top_k: 10
  api_url: null               # для type: api
  api_key: null
  timeout: 2.0                # секунды; при ошибке API -> порядок RRF
  weights: {}                  # для heuristic, см. HeuristicRanker в recsys/ranking.py

diversity:
  max_per_artist: 0            # 0 = без ограничения. Ограничение даёт разнообразие, но на офлайн-метриках
                               # мешает: пользователи возвращаются к своим артистам (синтетика: hit@10 0.66 -> 0.60)

explainer:
  type: stub                   # stub (приветствие + список) | llm
  n_describe: 10
  max_new_tokens: 300          # для type: llm
