# Пути относительные: ноутбук запускается из корня репозитория.

data:
  source: crs                  # crs — Music4All-CRS (docs/dataset.md) | synthetic — без файлов, для тестов кода
  eval_split: test_public      # на каких запросах считать метрики
  max_queries_per_user: 5      # сколько запросов брать на пользователя (у одного — до сотен); null = все
  max_tags: 20                 # теги Last.fm с наибольшим весом
  seed: 42
  cache_dir: cache             # кэш каталога crs (parquet + эмбеддинги .npy)
  use_cache: true

  synthetic:
    n_tracks: 5000
    n_users: 300
    seed: 42

  crs:
    dir: music4all_crs         # tracks_meta, train, test_public, *_queries, *_qrels (docs/dataset.md)
    splits: [test_public]      # какие сплиты загружать (train — для обучения ранкера)
    n_users: 300               # сэмпл пользователей на сплит (в test_public 12.2k); null = все
    seed: 42

llm:
  type: stub                   # stub | local | gemma_service (сервис в DataSphere)
  model_name: Qwen/Qwen2.5-1.5B-Instruct   # для качества: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 512
  temperature: 0.0
  device_map: auto
  torch_dtype: auto
  load_in_4bit: false
  stub_response: ""           # что отвечает StubLLM (пусто -> правила/шаблон)
  gemma_service:               # код в этом репозитории; процесс и веса — вне него
    path: ""                    # пакет импортируется из корня репозитория
    module: llm_gemma_service.gemma_service
    function: measure_chat
    chat: true                  # сохранять роли system/user/assistant
    timeout: 300                # ожидание ответа; холодный запуск отдельно до 900 секунд

summarizer:
  type: rule                   # rule (заглушка) | llm (фолбэк на rule)
  min_tag_count: 2

candgen:                       # сервис-кандген HNSW по HTTP (API: docs/candgen_api.md): retrieval.hnsw
  timeout: 5.0                 # секунды на запрос; при ошибке источник пропускается
  retries: 1                   # повтор при обрыве соединения (таймаут не повторяется)
  hnsw:
    url: ${HNSW_URL}           # текстовый семантический поиск (релиз hnsw-v1)
    api_key: ${HNSW_API_KEY}   # заголовок X-API-Key; пусто = без ключа
    embedder:                  # вектор запроса строим сами (сервис принимает только vector): recsys/retrieval/
                               # query_embedder.py; подготовка — python make_embed.py; без модели hnsw пропускается
      model_name: google/embeddinggemma-2
      device: null             # null — сама: cuda, если есть GPU, иначе cpu
      dtype: null              # null — float16 на GPU, float32 на CPU

retrieval:                     # источники кандидатов (recsys/retrieval/); enabled: false выключает
  relisten: {enabled: true, top_k: 100, history_weight: 0.3}   # свои треки: 93% целей — повторные прослушивания
  audio:    {enabled: true, top_k: 200}                        # MuQ: похожие на образец (similar_to) или на вкус
  bm25:     {enabled: true, top_k: 200}                        # локальный BM25 по карточке трека (bm25_index)
  hnsw:     {enabled: true, top_k: 200}                        # сервис HNSW: вектор реплики (candgen.hnsw)

bm25_index:                    # локальный BM25 по карточке трека: источник bm25 и совпадение с запросом в relisten
  k1: 1.2                      # (recsys/retrieval/local_index.py); собирается ~минуту и кэшируется в data.cache_dir:
  b: 0.75                      # python make_index.py
  weights: {meta: 1.0, caption: 0.0, lyrics: 1.25, album: 0.0, artist: 0.0, about: 0.3}   # вес поля в скоре;
                               # 0 — поле не участвует (индекс пересобирать не нужно). Подобраны на train:
                               # текст песни даёт основной прирост (relisten nDCG@20 0.21 -> 0.28),
                               # caption, album, artist по отдельности не помогают

semantic_ids:                  # коды RQ-VAE по MuQ для двухбашенного кандгена (recsys/semantic_ids.py,
  dir: artifacts/semantic_ids  # docs/semantic_ids.md); проверка: python check_semantic_ids.py
  codes: semantic_codes.npy    # (n_tracks, 4): 3 кода 0..255 + номер при коллизии; строка = tracks_meta по m4a_id
  checkpoint: rqvae_checkpoint.pt   # энкодер MuQ -> 32, три кодбука 256 x 32

fusion:
  rrf_k: 60
  top_n: 500                   # сколько отдаём в ранкер
  exclude_listened: false      # 93% целей в датасете — повторные прослушивания, их нельзя выкидывать
  exclude_top_tags: 3          # «no pop»: выкидывать трек, только если тег среди первых N его тегов по весу;
                               # 0 — с любым таким тегом или жанром (теряло цель в 0.4% запросов train)
  constraints:                 # ограничения запроса: год, тональность, bpm, энергия, instrumental, пол вокала, язык
    use: [year, mode, bpm, energy, instrumental, vocals, lang]   # [] — выкл; country хуже (цель ей верна в ~80%)
    penalty: 1.0               # вычитается из RRF за каждое нарушение (RRF ~0.01–0.1): нарушители уходят вниз
    hard: false                # true — выкидывать нарушителей (на train хуже: теряет цель в 1.1% запросов)
  weights: {relisten: 1.0, audio: 0.5, bm25: 1.0, hnsw: 1.0}
  no_query_boost: {relisten: 1.5, audio: 1.5}   # запрос пустой («ещё»): больше доверяем истории

ranker:
  type: stub                   # stub (порядок RRF) | heuristic | api
  top_k: 20                    # длина выдачи: метрика датасета — nDCG@20
  api_url: null               # для type: api
  api_key: null
  timeout: 2.0                # секунды; при ошибке API -> порядок RRF
  weights: {}                  # для heuristic, см. HeuristicRanker в recsys/ranking.py

diversity:
  max_per_artist: 0            # 0 = без ограничения. Ограничение даёт разнообразие, но на офлайн-метриках
                               # мешает: пользователи возвращаются к своим артистам (синтетика: hit@10 0.66 -> 0.60)

explainer:
  type: stub                   # stub (приветствие + список) | llm
  n_describe: 10
  max_new_tokens: 300          # для type: llm
