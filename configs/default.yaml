# Все параметры пайплайна. Запуск: python -m recsys <команда> (recsys/__main__.py); любой ключ — --set a.b=c,
# ещё YAML поверх — --config. Пути относительные: запускать из корня репозитория.

data:
  source: crs                  # crs — Music4All-CRS (docs/dataset.md) | synthetic — без файлов, для тестов кода
  dir: music4all_crs           # tracks_meta, train, test_public, *_queries, *_qrels
  cache_dir: cache             # каталог, индексы, выдача кандгенов (всё пересобирается само при изменении)
  max_tags: 20                 # теги Last.fm с наибольшим весом в каталоге
  windows:                     # начало окна позитивов = граница истории (docs/dataset.md)
    train: "2020-01-21"
    test_public: "2020-02-20"
    test_private: "2020-02-20"
  parts:                       # части запросов без утечки (recsys/data/parts.py)
    train_split: train
    test_split: test_public
    buckets:                   # бакет md5 текста запроса: [от, до)
      index: [0, 6]            # обучаемые кандгены: query_document, query_tfidf, two-tower
      ranker_train: [6, 9]     # обучение ранкера
      valid: [9, 10]           # подбор весов отбора и параметров, early stopping
    exclude_test_texts: true   # тексты сплита index_excludes не идут в index
    index_excludes: test_public  # не test_split: при ответах на test_private index (и обученный ранкер) те же
    sizes: {ranker_train: 30000, valid: 4000, test: 10000, submit: null}   # null — все
    seed: 42
  synthetic: {n_tracks: 5000, n_users: 300, seed: 42}

candgen:
  top_k: 1000                  # длина списка каждого кандгена (если у него не задано своё)
  batch_size: 256
  sources:                     # enabled: false — кандген не считается и не попадает ни в отбор, ни в признаки;
                               # features: false — участвует в отборе, но не в признаках ранкера (обучен на всём train)
    # тексты (recsys/candgen/text.py): индексы по документам трека, как у team1
    bm25:              {enabled: true}
    metadata_bm25:     {enabled: true}
    tfidf:             {enabled: true}
    query_tfidf:       {enabled: true}     # по запросам части index к треку
    metadata_char:     {enabled: true}
    card_bm25:         {enabled: false}    # наш: карточка по полям с весами, по разбору запроса (card.py)
    # история (recsys/candgen/history.py)
    history:           {enabled: true}
    history_recent:    {enabled: true}
    history_frequency: {enabled: true}
    favorite_artists:  {enabled: true}
    relisten:          {enabled: false, top_k: 300, history_weight: 0.3}   # наш: история + совпадение с запросом
    # звучание MuQ (recsys/candgen/audio.py)
    audio_taste:       {enabled: true}
    audio_recent:      {enabled: true}
    audio_seed:        {enabled: false}    # наш: похожие на образец «like X by Y» (similar_to)
    # плотные (recsys/candgen/dense.py): векторы считаются заранее на GPU
    hnsw:              {enabled: false, dir: artifacts/hnsw, online: false}       # scripts/encode_hnsw.py
    twotower:          {enabled: false, dir: artifacts/twotower/v2, online: false, checkpoint: model.pt, features: false}
  card_index:                  # карточка трека для card_bm25 и relisten (recsys/candgen/card.py)
    k1: 1.2
    b: 0.75
    weights: {meta: 1.0, caption: 0.0, lyrics: 1.25, album: 0.0, artist: 0.0, about: 0.3}   # 0 — поле не участвует

selection:                     # отбор кандидатов для ранкера (recsys/selection.py)
  limit: 150                   # сколько кандидатов получает ранкер
  rrf_k: 60                    # скор = сумма weight / (rrf_k + место в списке кандгена)
  weights:                     # одни для всех запросов (query_type модели не известен); кандген без веса в отбор
                               # не идёт (или вес 0), но остаётся признаком ранкера. Подобрать: python -m recsys tune-policy.
                               # Сейчас — общая политика team1 (fallback из их candidate_policy.json)
    {bm25: 2, query_tfidf: 2, history: 1, history_recent: 1, history_frequency: 1, favorite_artists: 1, audio_recent: 1}
  union_rrf_k: 60              # RRF всех кандгенов без весов: признак all_rrf_score
  filters: []                  # жёсткие фильтры до отбора: banned (показанное, скипнутое; прослушанное для
                               # similar_to / novelty), exclude_artist (артист образца, «no X»), new_artist
                               # (novelty: артист не из истории), exclude_tag («no rap»)
  exclude_top_tags: 3          # exclude_tag: тег среди первых N тегов трека по весу (0 — любой тег или жанр)
  min_results: 20              # если фильтры оставили меньше — добираем из всех кандидатов по all_rrf

tune:                          # подбор весов отбора на valid: python -m recsys tune-policy (recsys/tune.py)
  rrf_ks: [20, 60]
  text_weights: [1, 2, 4]      # вес текстовых и плотных кандгенов (остальные — 1)
  min_gain: 0.002              # добавлять кандген, пока recall@limit растёт хотя бы на столько

features:                      # признаки ранкера (recsys/features.py), группы по порядку
  groups: [text, history, item, rrf, sources, selection]   # + summary — признаки разбора запроса

ranker:
  type: catboost               # catboost (обучается: python -m recsys train) | stub (порядок отбора)
  model_dir: null              # папка модели; null — runs/<run.name>/ranker
  top_k: 20                    # длина выдачи: метрика датасета — nDCG@20
  threads: 6
  catboost:
    loss_function: YetiRank
    eval_metric: "NDCG:top=20"
    iterations: 350
    depth: 6
    learning_rate: 0.06
    l2_leaf_reg: 5
    one_hot_max_size: 20
    random_seed: 42
    border_count: 128
    early_stopping_rounds: 50  # по части valid

eval:
  k: 20
  recall_at: [20, 50, 100, 150, 200, 500, 1000]

run:
  dir: runs                    # runs/<name>/: конфиг, модель ранкера, отчёты, сабмит
  name: baseline               # имя прогона (--run <имя>)
  chunk: 20000                 # запросов за раз: столько списков кандгенов держим в памяти

# ---------------------------------------------------------------- ответ и диалог

llm:
  type: stub                   # stub | local | gemma_service (сервис в DataSphere)
  model_name: Qwen/Qwen2.5-1.5B-Instruct   # для качества: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 512
  temperature: 0.0
  device_map: auto
  torch_dtype: auto
  load_in_4bit: false
  stub_response: ""           # что отвечает StubLLM (пусто -> правила/шаблон)
  gemma_service:               # код в этом репозитории; процесс и веса — вне него
    path: ""                    # пакет импортируется из корня репозитория
    module: llm_gemma_service.gemma_service
    function: measure_chat
    chat: true                  # сохранять роли system/user/assistant
    timeout: 300                # ожидание ответа; холодный запуск отдельно до 900 секунд

summarizer:                    # разбор запроса -> DialogSummary (recsys/dialog.py): нужен card_bm25, relisten,
  type: rule                   # audio_seed и фильтрам; rule | llm (фолбэк на rule)
  min_tag_count: 2

explainer:
  type: template               # template (по метаданным и истории, как сабмит team1) | stub (список) | llm
  n_describe: 10
  max_new_tokens: 300          # для type: llm

# ---------------------------------------------------------------- двухбашенный кандген

semantic_ids:                  # коды RQ-VAE по MuQ для двухбашенного кандгена (recsys/semantic_ids.py,
  dir: artifacts/semantic_ids  # docs/semantic_ids.md); проверка: python scripts/check_semantic_ids.py
  codes: semantic_codes.npy    # (n_tracks, 4): 3 кода 0..255 + номер при коллизии; строка = tracks_meta по m4a_id
  checkpoint: rqvae_checkpoint.pt   # энкодер MuQ -> 32, три кодбука 256 x 32

twotower: {}                   # обучение двухбашенного кандгена — configs/twotower.yaml
