services:
  bm25:
    build: .
    ports:
      - "8000:8000"
    environment:
      BM25_INDEXES_DIR: /indexes
      # Empty = auth disabled (fine locally). Set a value to require the X-API-Key header.
      BM25_API_KEY: ${BM25_API_KEY:-}
    volumes:
      - ./indexes:/indexes:ro
    restart: unless-stopped

  # One-off job: build indexes from ../data/tracks_meta.jsonl.
  #   docker compose run --rm build-indexes
  # then: docker compose restart bm25   (indexes are loaded once at startup)
  build-indexes:
    build: .
    profiles: ["tools"]
    user: root
    volumes:
      - ./indexes:/out
      - ../data:/data:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        python build_index.py --input /data/tracks_meta.jsonl --field m4a_genres_full --out /out/genres &&
        python build_index.py --input /data/tracks_meta.jsonl --field m4a_tags_full --out /out/tags
