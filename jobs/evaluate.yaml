# Полный прогон в DataSphere Jobs: обучение ранкера и метрики (python -m recsys run), ноутбук держать открытым не нужно.
#   pip install datasphere                                           # CLI, один раз
#   datasphere project job execute -p <id проекта> -c jobs/evaluate.yaml
# Запускать из корня репозитория, в venv с зависимостями requirements.txt.
#
# Перед запуском:
#   * music4all_crs/ — tracks_meta, train, test_public, *_queries, *_qrels; папка загружается в задание целиком.
#   * индексы и выдача кандгенов (cache/) не загружаются: задание собирает их в начале (несколько минут).
#   * hnsw / twotower: включить в cmd (--sources +hnsw) и добавить папку с векторами в inputs.
# Результат (runs/job/: ранкер, отчёты valid и test) скачивается в run_result/ после выполнения.
# Сабмит — та же команда с submit вместо run (после run, в ту же папку прогона).
name: recsys-run
desc: Обучение ранкера и метрики всех шагов на valid и test

cmd: >
  python3 -m recsys run --run job
  --set data.dir=${DATA} --set run.dir=${RESULT}

inputs:
  - configs/default.yaml
  - music4all_crs:
      var: DATA

outputs:
  - run_result: RESULT

env:
  vars:
    - PYTHONUNBUFFERED: 1        # прогресс в логе задания сразу, а не в конце
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements.txt
    local-paths:
      - recsys

cloud-instance-types:
  - c1.8                         # CPU: GPU для пайплайна без LLM не нужен; признаки и CatBoost любят ядра
