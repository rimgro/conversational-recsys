# Полный прогон валидации в DataSphere Jobs: скрипт работает в облаке, ноутбук держать открытым не нужно.
#   pip install datasphere                                           # CLI, один раз
#   datasphere project job execute -p <id проекта> -c jobs/evaluate.yaml
# Запускать из корня репозитория, в venv с зависимостями requirements.txt.
#
# Перед запуском:
#   * music4all_crs/ — tracks_meta.parquet, test_public.parquet, test_public_queries.parquet,
#     test_public_qrels.parquet (train не нужен); папка загружается в задание целиком.
#   * секреты проекта HNSW_URL, HNSW_API_KEY — секреты DataSphere передаются заданию
#     как переменные окружения. Без сервисов: добавить --offline в cmd.
#   * индекс BM25 (cache/) не загружается: задание собирает его из tracks_meta в начале (~20 с).
# Результат (metrics.json, submission.parquet, by_query_type.csv, ...) скачивается в eval_result/ после выполнения.
# Быстрая проверка — --n-users 300 вместо all.
name: recsys-evaluate
desc: Метрики пайплайна на test_public (HNSW с сервера, BM25 локальный)

cmd: >
  python3 evaluate.py --split test_public --n-users all
  --data-dir ${DATA} --run-dir ${RESULT}

inputs:
  - configs/default.yaml
  - music4all_crs:
      var: DATA

outputs:
  - eval_result: RESULT

env:
  vars:
    - PYTHONUNBUFFERED: 1        # прогресс в логе задания сразу, а не в конце
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements.txt
    local-paths:
      - evaluate.py
      - recsys

cloud-instance-types:
  - c1.4                         # CPU: GPU для пайплайна без LLM не нужен
